<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 乐造AI教务平台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --dark: #0f172a;
            --dark-soft: #1e293b;
            --gray: #64748b;
            --gray-light: #94a3b8;
            --light: #f8fafc;
            --white: #ffffff;
            --gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        
        .container {
            background: var(--white);
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 420px;
            overflow: hidden;
        }
        
        .header {
            background: var(--gradient);
            color: white;
            padding: 1.5rem 2rem;
            position: relative;
        }
        
        .back-btn {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem;
        }
        
        .header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            text-align: center;
        }
        
        .content {
            padding: 2rem;
        }
        
        .form-group {
            margin-bottom: 1rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--dark);
            font-size: 0.875rem;
        }
        
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s;
        }
        
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }
        
        .btn {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 0.5rem;
        }
        
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        
        .btn-primary:hover {
            background: var(--primary-dark);
        }
        
        .btn-primary:disabled {
            background: var(--gray-light);
            cursor: not-allowed;
        }
        
        .btn-link {
            background: none;
            color: var(--primary);
            font-size: 0.875rem;
        }
        
        .btn-link:hover {
            text-decoration: underline;
        }
        
        .error {
            background: #fef2f2;
            color: var(--danger);
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.875rem;
            display: none;
        }
        
        .error.show {
            display: block;
        }
        
        .footer {
            text-align: center;
            padding: 1rem;
            color: var(--gray-light);
            font-size: 0.75rem;
            border-top: 1px solid #e2e8f0;
        }
        
        .loading {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 0.5rem;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="back-btn" onclick="location.href='index.html'">←</button>
            <h1>注册学生账号</h1>
        </div>
        
        <div class="content">
            <div class="error" id="error"></div>
            
            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="username">用户名 *</label>
                    <input type="text" id="username" name="username" required placeholder="请输入用户名" minlength="3">
                </div>
                
                <div class="form-group">
                    <label for="password">密码 *</label>
                    <input type="password" id="password" name="password" required placeholder="请输入密码" minlength="6">
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword">确认密码 *</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="请再次输入密码">
                </div>
                
                <div class="form-group">
                    <label for="name">姓名 *</label>
                    <input type="text" id="name" name="name" required placeholder="请输入姓名">
                </div>
                
                <div class="form-group">
                    <label for="classId">班级</label>
                    <select id="classId" name="classId">
                        <option value="">请选择班级（可选）</option>
                        <option value="class-scratch-basic">Scratch基础班</option>
                        <option value="class-scratch-advanced">Scratch进阶班</option>
                        <option value="class-python-basic">Python基础班</option>
                    </select>
                </div>
                
                <button type="submit" class="btn btn-primary" id="registerBtn">
                    注册
                </button>
                
                <button type="button" class="btn btn-link" onclick="location.href='index.html'">
                    已有账号？登录
                </button>
            </form>
        </div>
        
        <div class="footer">
            © 2026 乐造AI | 教务管理系统
        </div>
    </div>
    
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script>
        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = message;
            errorEl.classList.add('show');
        }
        
        function hideError() {
            document.getElementById('error').classList.remove('show');
        }
        
        async function handleRegister(event) {
            event.preventDefault();
            hideError();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const name = document.getElementById('name').value.trim();
            const classId = document.getElementById('classId').value;
            const registerBtn = document.getElementById('registerBtn');
            
            // 验证
            if (!username || !password || !name) {
                showError('请填写所有必填项');
                return;
            }
            
            if (password.length < 6) {
                showError('密码至少6位');
                return;
            }
            
            if (password !== confirmPassword) {
                showError('两次密码输入不一致');
                return;
            }
            
            // 显示加载状态
            registerBtn.disabled = true;
            registerBtn.innerHTML = '<span class="loading"></span>注册中...';
            
            try {
                const result = await AuthService.register(username, password, name, classId);
                
                if (result.success) {
                    // 保存登录信息
                    Storage.setAuth(result.user, result.token, true);
                    
                    alert('注册成功！');
                    location.href = 'dashboard.html';
                } else {
                    showError(result.error || '注册失败');
                }
            } catch (error) {
                console.error('注册错误:', error);
                showError('注册失败，请稍后重试');
            } finally {
                registerBtn.disabled = false;
                registerBtn.textContent = '注册';
            }
        }
        
        // 检查是否已登录
        window.onload = function() {
            const auth = Storage.getAuth();
            if (auth) {
                location.href = 'dashboard.html';
            }
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>乐造AI教务平台 - 登录</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --dark: #0f172a;
            --dark-soft: #1e293b;
            --gray: #64748b;
            --gray-light: #94a3b8;
            --light: #f8fafc;
            --white: #ffffff;
            --gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        
        .container {
            background: var(--white);
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 420px;
            overflow: hidden;
        }
        
        .header {
            background: var(--gradient);
            color: white;
            padding: 2rem;
            text-align: center;
        }
        
        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 0.875rem;
        }
        
        .content {
            padding: 2rem;
        }
        
        /* 角色选择 */
        .role-select {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        
        .role-btn {
            flex: 1;
            padding: 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            background: var(--white);
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        
        .role-btn:hover {
            border-color: var(--primary-light);
        }
        
        .role-btn.active {
            border-color: var(--primary);
            background: #eef2ff;
        }
        
        .role-btn .icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        
        .role-btn .text {
            font-weight: 600;
            color: var(--dark);
        }
        
        /* 表单 */
        .form-group {
            margin-bottom: 1rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--dark);
            font-size: 0.875rem;
        }
        
        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }
        
        .checkbox-group input {
            width: auto;
        }
        
        .checkbox-group label {
            font-size: 0.875rem;
            color: var(--gray);
            cursor: pointer;
        }
        
        /* 按钮 */
        .btn {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        
        .btn-primary:hover {
            background: var(--primary-dark);
        }
        
        .btn-primary:disabled {
            background: var(--gray-light);
            cursor: not-allowed;
        }
        
        .btn-link {
            background: none;
            color: var(--primary);
            margin-top: 1rem;
            font-size: 0.875rem;
        }
        
        .btn-link:hover {
            text-decoration: underline;
        }
        
        /* 错误提示 */
        .error {
            background: #fef2f2;
            color: var(--danger);
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.875rem;
            display: none;
        }
        
        .error.show {
            display: block;
        }
        
        /* 页脚 */
        .footer {
            text-align: center;
            padding: 1rem;
            color: var(--gray-light);
            font-size: 0.75rem;
            border-top: 1px solid #e2e8f0;
        }
        
        /* 加载动画 */
        .loading {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 0.5rem;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎓 乐造AI教务平台</h1>
            <p>老师和学生登录入口</p>
        </div>
        
        <div class="content">
            <!-- 角色选择 -->
            <div class="role-select">
                <button class="role-btn active" data-role="teacher" onclick="selectRole('teacher')">
                    <div class="icon">👨‍🏫</div>
                    <div class="text">老师</div>
                </button>
                <button class="role-btn" data-role="student" onclick="selectRole('student')">
                    <div class="icon">👨‍🎓</div>
                    <div class="text">学生</div>
                </button>
            </div>
            
            <!-- 错误提示 -->
            <div class="error" id="error"></div>
            
            <!-- 登录表单 -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" required placeholder="请输入用户名">
                </div>
                
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" required placeholder="请输入密码">
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">记住我（7天免登录）</label>
                </div>
                
                <button type="submit" class="btn btn-primary" id="loginBtn">
                    登录
                </button>
                
                <button type="button" class="btn btn-link" onclick="location.href='register.html'">
                    没有账号？注册学生账号
                </button>
            </form>
        </div>
        
        <div class="footer">
            © 2026 乐造AI | 教务管理系统
        </div>
    </div>
    
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script>
        // 当前选中的角色
        let currentRole = 'teacher';
        
        // 选择角色
        function selectRole(role) {
            currentRole = role;
            document.querySelectorAll('.role-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.role === role);
            });
        }
        
        // 显示错误
        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = message;
            errorEl.classList.add('show');
        }
        
        // 隐藏错误
        function hideError() {
            document.getElementById('error').classList.remove('show');
        }
        
        // 处理登录
        async function handleLogin(event) {
            event.preventDefault();
            hideError();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;
            const loginBtn = document.getElementById('loginBtn');
            
            if (!username || !password) {
                showError('请输入用户名和密码');
                return;
            }
            
            // 显示加载状态
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="loading"></span>登录中...';
            
            try {
                const result = await AuthService.login(username, password, currentRole);
                
                if (result.success) {
                    // 保存登录信息
                    Storage.setAuth(result.user, result.token, remember);
                    
                    // 跳转工作台
                    location.href = 'dashboard.html';
                } else {
                    showError(result.error || '登录失败');
                }
            } catch (error) {
                console.error('登录错误:', error);
                showError('登录失败，请稍后重试');
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = '登录';
            }
        }
        
        // 检查是否已登录
        window.onload = function() {
            const auth = Storage.getAuth();
            if (auth) {
                // 已登录，跳转到工作台
                location.href = 'dashboard.html';
            }
        };
    </script>
</body>
</html>
